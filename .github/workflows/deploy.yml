name: CI/CD

on:
  push:
    branches: ["ans"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openssh-client netcat-openbsd

      - name: Configure OpenVPN
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          set -eu

          test -n "$OVPN_CONFIG" || {
            echo "ERROR: OVPN_CONFIG is empty"
            exit 1
          }

          printf '%s\n' "$OVPN_CONFIG" > "$RUNNER_TEMP/client.ovpn"
          chmod 600 "$RUNNER_TEMP/client.ovpn"

      - name: Connect to OpenVPN
        env:
          OVPN_USERNAME: ${{ secrets.OVPN_USERNAME }}
          OVPN_PASSWORD: ${{ secrets.OVPN_PASSWORD }}
        run: |
          set -eu

          test -n "$OVPN_USERNAME"
          test -n "$OVPN_PASSWORD"

          printf '%s\n%s\n' \
            "$OVPN_USERNAME" "$OVPN_PASSWORD" \
            > "$RUNNER_TEMP/ovpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/ovpn-auth.txt"

          sudo openvpn \
            --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/ovpn-auth.txt" \
            --auth-nocache \
            --daemon \
            --writepid "$RUNNER_TEMP/openvpn.pid" \
            --log "$RUNNER_TEMP/openvpn.log"

          connected=false

          for i in $(seq 1 45); do
            if sudo grep -q "Initialization Sequence Completed" \
              "$RUNNER_TEMP/openvpn.log"; then
              connected=true
              break
            fi

            if sudo grep -Eq \
              "AUTH_FAILED|Options error|Exiting due to fatal error" \
              "$RUNNER_TEMP/openvpn.log"; then
              break
            fi

            sleep 2
          done

          if [ "$connected" != true ]; then
            echo "ERROR: OpenVPN failed to initialize"
            sudo cat "$RUNNER_TEMP/openvpn.log"
            exit 1
          fi

          echo "OpenVPN initialized successfully"
          ip -brief addr show tun0
          ip route

      - name: Verify SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          test -n "$SSH_HOST"
          test -n "$SSH_PORT"

          echo "=== VPN interface ==="
          ip -brief addr show tun0

          echo "=== Resolve SSH hostname ==="
          getent ahostsv4 "$SSH_HOST"

          echo "=== Check SSH port ==="
          nc -vz -w 5 "$SSH_HOST" "$SSH_PORT"

      - name: Deploy via private SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          WORKDIR: ${{ vars.WORKDIR }}
        run: |
          set -eu

          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$WORKDIR"

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$WORKDIR' &&
             git fetch origin ans &&
             git reset --hard origin/ans"

      - name: Cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/openvpn.pid" ]; then
            sudo kill "$(cat "$RUNNER_TEMP/openvpn.pid")" 2>/dev/null || true
          fi

          sudo pkill openvpn 2>/dev/null || true
          rm -f "$RUNNER_TEMP/client.ovpn"
          rm -f "$RUNNER_TEMP/ovpn-auth.txt"
          rm -f "$RUNNER_TEMP/openvpn.pid"
          rm -f "$RUNNER_TEMP/openvpn.log"
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts
